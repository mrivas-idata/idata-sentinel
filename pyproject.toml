[project]
name = "idata-sentinel"
version = "0.1.0"
description = "IDATA Sentinel — plataforma de diagnóstico de seguridad web (IDATA Chile)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "dnspython>=2.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
idata-sentinel = "idata_sentinel.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idata_sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that spin up local network resources (excluded by default)",
]
addopts = "-m 'not integration'"
