# Branding IDATA — parametrizado (plan maestro §8) para no tocar código por reporte.
company_name: "IDATA Chile"
company_url: "https://idatachile.com"
# Ruta relativa a este directorio; null = usar solo el nombre en texto.
# El logo tiene fondo blanco incrustado (ninguna variante entregada trae
# transparencia real), así que sobre fondos oscuros se coloca dentro de una
# pastilla clara. Ver reporting/branding.py.
logo_path: logo.png
logo_needs_light_background: true
palette:
  background: "#0b1220"
  surface: "#131b2e"
  text: "#e6e9f0"
  text_muted: "#9aa4b8"
  primary: "#3b82f6"
  critical: "#dc2626"
  high: "#ea580c"
  medium: "#d97706"
  low: "#0891b2"
  info: "#64748b"
font_family: "'Segoe UI', Helvetica, Arial, sans-serif"
