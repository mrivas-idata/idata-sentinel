# Servicios de terceros que reciben datos del visitante (plan maestro §5).
#
# Relevante para la Ley 21.719: cargar estos scripts *antes* de obtener el
# consentimiento implica tratar datos personales sin base de licitud, y la
# mayoría transfiere los datos fuera de Chile.
#
# kind: analytics | advertising | social | tag_manager | session_replay | chat
# abroad: true si el responsable procesa los datos fuera de Chile
# Curado a mano; ampliar según lo observado en escaneos reales.

- name: Google Analytics
  kind: analytics
  abroad: true
  controller: Google LLC (EE.UU.)
  patterns: ["google-analytics.com", "gtag/js", "googletagmanager.com/gtag"]

- name: Google Tag Manager
  kind: tag_manager
  abroad: true
  controller: Google LLC (EE.UU.)
  patterns: ["googletagmanager.com/gtm.js", "googletagmanager.com/ns.html"]

- name: Google Ads / DoubleClick
