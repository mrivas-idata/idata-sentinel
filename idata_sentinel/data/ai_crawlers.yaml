# Agentes de motores generativos (plan SEO/GEO §7.1).
#
# `purpose` separa dos decisiones que suelen confundirse:
#
#   - training: el agente recolecta contenido para entrenar modelos. Bloquearlo
#     es una decisión editorial legítima y no perjudica la visibilidad.
#   - citation: el agente alimenta las respuestas que el usuario ve, con enlace
#     a la fuente. Bloquearlo es renunciar a aparecer citado.
#
# El check informa de cada grupo por separado y no prescribe: quién cede su
# contenido para entrenamiento es una decisión del cliente, no nuestra.

- agent: GPTBot
  vendor: OpenAI
  purpose: training
- agent: OAI-SearchBot
  vendor: OpenAI
  purpose: citation
