# Catálogo de ayuda por módulo. Fuente única para la CLI (`idata-sentinel help`),
# la app web y el reporte, para que las tres cuenten lo mismo.

- key: vuln_identification
  alias: vuln
  label: Identificación de vulnerabilidades
  phase: "Fase 1"
  tagline: Detecta brechas de configuración antes que un atacante.
  purpose: >-
    Analiza cómo está configurado el sitio y qué revela sin querer. Es el corazón
    técnico del diagnóstico y alimenta el score global.
  what_it_does:
    - "Cabeceras de seguridad HTTP: HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy y Permissions-Policy."
    - "Aislamiento de origen (COOP/CORP): la defensa actual contra XS-Leaks y tabnabbing."
    - "Calidad real de la CSP, no solo su presencia: falta de base-uri (la evasión de nonces más común), object-src sin restringir, listas de dominios sin nonce ni hash, y políticas que solo están en modo reporte."
    - "CORS: comodín combinado con credenciales, y aceptación del origen 'null'."
    - "TLS/SSL: versión de protocolo, cifradores débiles, validez y vencimiento del certificado, cadena de confianza y redirección forzada a HTTPS."
    - "Cookies: flags Secure, HttpOnly y SameSite en cada cookie emitida."
    - "Fingerprint de tecnología y versión expuesta, con CVEs conocidas cruzadas de forma informativa."
    - "Archivos de seguridad: security.txt (RFC 9116), robots.txt con rutas sensibles y listado de directorios abierto."
    - "Exposición de información: errores verbosos, metadatos y formularios sin HTTPS."
  key_findings:
    - "hsts_missing — el navegador puede ser degradado a HTTP."
    - "cert_expired / cert_expiring_soon — el sitio queda inutilizable o a días de estarlo."
    - "tls_legacy_protocol — se acepta TLS 1.0/1.1, criptografía rota."
    - "csp_missing_base_uri — la CSP existe pero se evade inyectando una etiqueta <base>."
    - "cors_wildcard_with_credentials — cualquier origen podría leer datos autenticados."
    - "vulnerable_component — la versión instalada cae en el rango afectado por CVEs publicadas. Penaliza la nota con la severidad del propio CVE; nunca se comprueba explotabilidad."
  legal: >-
    Todos los checks son observacionales. No se prueban credenciales, no se
    inyecta nada y jamás se explota una CVE: solo se reporta la versión que el
    propio servidor publica.
  examples:
    - "idata-sentinel scan https://cliente.cl --modules vuln"
    - "idata-sentinel scan https://cliente.cl --modules vuln --pdf informe.pdf"
  report_section: "Secciones 2, 4 y 7 del reporte"

- key: asset_inventory
  alias: assets
  label: Inventario de activos tecnológicos
  phase: "Fase 3"
  tagline: Descubre la superficie de ataque real, no la declarada.
  purpose: >-
    Levanta todos los activos publicados del dominio y los correlaciona con su
    tecnología y su riesgo. No se protege lo que no se sabe que existe.
  what_it_does:
    - "Descubre subdominios leyendo los Certificate Transparency logs (crt.sh). Sin fuerza bruta de nombres."
    - "Resuelve A, AAAA, CNAME, MX, TXT, NS y CAA de cada activo."
    - "Perfila cada activo con un único GET: estado, tecnología, CDN, WAF y proveedor cloud."
    - "Detecta riesgo de apropiación de subdominio (CNAME colgante hacia un SaaS)."
    - "Evalúa la seguridad del correo del dominio: SPF, DMARC, MTA-STS, TLS-RPT, CAA y DNSSEC."
    - "Marca entornos no productivos publicados y filtraciones de la IP de origen tras el CDN."
  key_findings:
    - "subdomain_takeover_risk — un tercero podría publicar contenido en un subdominio de la empresa."
    - "non_production_asset_exposed — un entorno de pruebas visible desde Internet."
    - "spf_missing / dmarc_missing — cualquiera puede enviar correo suplantando el dominio."
    - "asset_without_https — un activo sirviendo tráfico en claro."
  legal: >-
    El descubrimiento usa solo registros públicos. Ante un posible takeover se
    reporta el riesgo pero nunca se reclama ni se ocupa el recurso huérfano: eso
    sería tomar control de infraestructura ajena.
  examples:
    - "idata-sentinel scan https://cliente.cl --modules assets"
    - "idata-sentinel scan https://cliente.cl --mode audit --i-have-authorization --authorized-by \"Ana Pérez, CISO\" --contract OC-123 --asset intranet.cliente.cl"
  report_section: "Sección 5 — Mapa de superficie de ataque"

- key: data_privacy
  alias: privacy
  label: Datos Personales (Ley 21.719)
  phase: "Fase 4"
  tagline: Señales técnicas de cumplimiento de la ley chilena de datos personales.
  purpose: >-
    Evalúa cómo el sitio captura, informa y comparte datos personales, y traduce
    los hallazgos a un semáforo por principio de la Ley 21.719.
  what_it_does:
    - "Busca la política de privacidad en los enlaces que la propia página publica y verifica que sea accesible."
    - "Detecta formularios que capturan datos personales y clasifica 12 categorías de dato."
    - "Marca aparte las categorías sensibles del art. 2 lit. g): salud, biométricos, ideología, vida sexual, origen étnico y situación socioeconómica."
    - "Verifica que los formularios con datos personales viajen cifrados."
    - "Detecta rastreadores de terceros activos sin mecanismo de consentimiento."
    - "Identifica grabación de sesión (session replay), que puede capturar lo que el usuario escribe."
    - "Lista las transferencias de datos a responsables fuera de Chile."
  key_findings:
    - "pii_form_insecure_transport — datos personales enviados sin cifrar. Crítico."
    - "privacy_policy_missing — no se informa al titular, la brecha más fácil de constatar."
    - "trackers_without_consent — se tratan datos desde el primer instante de la visita."
    - "session_replay_active — un tercero graba lo que el usuario escribe."
  legal: >-
    Evalúa señales técnicas observables. NO constituye una calificación legal de
    cumplimiento ni sustituye la asesoría del servicio de Datos Personales de
    IDATA. Nunca se adivinan rutas: la política se busca solo en enlaces publicados.
  examples:
    - "idata-sentinel scan https://cliente.cl --modules privacy"
    - "idata-sentinel scan https://cliente.cl --modules vuln,privacy --pdf informe.pdf"
  report_section: "Sección 6 — Cumplimiento Ley 21.719"

- key: monitoring
  alias: monitor
  label: Monitoreo continuo
  phase: "Fase 5"
  tagline: Convierte el diagnóstico puntual en vigilancia permanente.
  purpose: >-
    Compara cada escaneo contra la línea base del cliente y avisa cuando algo
    cambia. El valor no está en el hallazgo, sino en que aparezca uno nuevo.
  what_it_does:
    - "Guarda el primer escaneo de cada objetivo como línea base."
    - "Compara hallazgos: cuáles son nuevos, cuáles se resolvieron y cuáles se agravaron."
    - "Compara la superficie de ataque: activos nuevos, activos que desaparecieron y cambios de tecnología."
    - "Calcula la tendencia del score en el tiempo."
    - "Emite alertas por webhook ante hallazgos graves nuevos, activos nuevos, certificados por vencer o caídas de score."
    - "Programa re-escaneos diarios, semanales o mensuales."
  key_findings:
    - "new_finding_since_baseline — algo cambió desde la última foto."
    - "new_assets_detected — superficie de ataque que nadie declaró."
    - "risk_score_dropped — la postura se degradó de forma medible."
    - "findings_resolved — evidencia objetiva de mejora para la dirección."
  legal: >-
    El monitoreo respeta exactamente los mismos límites que un escaneo puntual,
    incluido el rate limit del modo pasivo. Los datos históricos quedan sujetos a
    la política de retención, que siempre preserva la línea base.
  examples:
    - "idata-sentinel monitor add https://cliente.cl --schedule weekly"
    - "idata-sentinel monitor list"
    - "idata-sentinel monitor run"
    - "idata-sentinel scan https://cliente.cl --record"
  report_section: "Sección 3 — Semáforo y tendencia"

- key: search_visibility
  alias: seo
  label: Visibilidad en buscadores y motores generativos
  phase: "Fase 5"
  tagline: Si no te encuentran ni te citan, el resto da lo mismo.
  purpose: >-
    Evalúa si el sitio puede ser encontrado, entendido y citado: por los buscadores
    clásicos (SEO), por los motores generativos que hoy responden sin enviar clics
    (GEO) y con qué rapidez responde al usuario. Puntúa en un eje propio y NO
    afecta al score de seguridad.
  what_it_does:
    - "Indexabilidad: robots.txt, meta robots y X-Robots-Tag, URL canónica, sitemap.xml y manejo de páginas inexistentes (soft 404)."
    - "Contenido: título, meta description, jerarquía de encabezados, texto alternativo de imágenes, idioma declarado, duplicados entre páginas y metadatos para compartir."
    - "Datos estructurados: JSON-LD y microdatos, identidad de la organización, migas de pan y preguntas frecuentes marcadas."
    - "SEO local: marcado de negocio local, dirección, teléfono pulsable, horario, área de servicio y consistencia del teléfono entre páginas."
    - "Motores generativos (GEO): qué agentes de IA bloquea robots.txt, distinguiendo los de entrenamiento de los que producen citas; llms.txt; contenido que solo existe tras ejecutar JavaScript; autoría, fechas y estructura citable."
    - "Rendimiento observable: tiempo de respuesta, compresión, caché, peso del HTML, recursos que bloquean el dibujado, imágenes y fuentes, y número de orígenes externos."
    - "Core Web Vitals reales (LCP, INP, CLS) solo con --with-field-data: los consulta al Chrome UX Report, que son mediciones de usuarios reales."
  key_findings:
    - "robots_blocks_indexing / meta_robots_noindex — el sitio no puede estar en el índice. No es posicionamiento: es ausencia."
    - "ai_crawlers_blocked_from_citation — el sitio se excluye de aparecer citado por los asistentes de IA."
    - "content_requires_javascript — el contenido parece existir solo tras renderizar, y los crawlers generativos no ejecutan JavaScript."
    - "soft_404 — las páginas inexistentes responden 200 y acaban indexadas."
    - "ttfb_slow — el servidor tarda en responder, que es el suelo de toda la experiencia."
  legal: >-
    Mismos límites que el modo pasivo: solo GET/HEAD, con espera entre peticiones,
    respetando robots.txt y sin ejecutar ni evadir nada. El rastreo tiene un
    presupuesto de páginas acotado (--seo-pages) y declara qué quedó fuera. La
    consulta de datos de campo envía la URL del objetivo a Google y por eso es
    opt-in explícito, nunca por omisión.
  examples:
    - "idata-sentinel scan https://cliente.cl --modules seo"
    - "idata-sentinel scan https://cliente.cl --modules seo --seo-pages 20"
    - "idata-sentinel scan https://cliente.cl --modules vuln,seo --pdf informe.pdf"
  report_section: "Sección 3b — Visibilidad en buscadores y motores generativos"
